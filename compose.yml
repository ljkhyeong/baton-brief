services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: baton_brief
      POSTGRES_USER: brief
      POSTGRES_PASSWORD: brief
    ports:
      - "${BRIEF_DB_PORT:-5432}:5432"
    volumes:
      - brief-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brief -d baton_brief"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brief-postgres-data:
