groups:
  - name: brief
    rules:
      - alert: BriefAlertDeliveryFailed
        expr: >-
          sum(increase(prometheus_notifications_errors_total{job="brief-prometheus"}[5m])) > 0
          or sum(increase(prometheus_notifications_dropped_total{job="brief-prometheus"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: BRIEF 경보의 Alertmanager 전달 오류 또는 유실이 발생했습니다.
      - alert: BriefMetricsUnavailable
        expr: up{job="brief"} == 0 or absent(up{job="brief"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: BRIEF 지표를 2분 이상 수집하지 못했습니다.
      - alert: BriefServerErrors
        expr: sum(increase(http_server_requests_seconds_count{job="brief",status=~"5.."}[5m])) >= 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: BRIEF의 최근 5분 서버 오류가 5건 이상입니다.
      - alert: BriefEventRejected
        expr: sum by (outcome) (increase(brief_events_received_total{job="brief",outcome=~"CONFLICT|UNSUPPORTED"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'BRIEF 이벤트 수신 거부: {{ $labels.outcome }}'
      - alert: BriefDatabaseConnectionWait
        expr: hikaricp_connections_pending{job="brief"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: BRIEF의 DB 연결 대기가 2분 이상 지속되고 있습니다.
      - alert: BriefEventRevisionGap
        expr: sum(increase(brief_events_received_total{job="brief",outcome="APPLIED_WITH_GAP"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: BRIEF 이벤트에서 원본 변경 번호의 공백을 탐지했습니다.
