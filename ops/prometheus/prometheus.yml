global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alert_relabel_configs:
    - target_label: service
      replacement: brief
  alertmanagers:
    - scheme: https
      file_sd_configs:
        - files: [/etc/prometheus/alertmanager-targets.yml]

scrape_configs:
  - job_name: brief
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [127.0.0.1:9091]
