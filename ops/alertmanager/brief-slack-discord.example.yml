# 공용 Alertmanager에는 아래 하위 경로와 수신처만 합친다. 기존 설정을 덮어쓰지 않는다.
route:
  receiver: unmatched
  routes:
    - receiver: brief-slack-discord
      matchers: ['service="brief"']
      group_by: [service, alertname, outcome, instance, pool]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

receivers:
  - name: unmatched
  - name: brief-slack-discord
    slack_configs:
      - api_url_file: /run/secrets/brief-slack-webhook-url
        send_resolved: true
        fallback: 'BRIEF {{ .Status }}: {{ .CommonLabels.alertname }}'
        title: '[BRIEF · {{ if eq .Status "firing" }}경보{{ else }}해제{{ end }}] {{ .CommonLabels.alertname }}'
        title_link: ''
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
    discord_configs:
      - webhook_url_file: /run/secrets/brief-discord-webhook-url
        send_resolved: true
        title: '[BRIEF · {{ if eq .Status "firing" }}경보{{ else }}해제{{ end }}] {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
