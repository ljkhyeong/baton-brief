services:
  brief:
    environment:
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
      MANAGEMENT_SERVER_PORT: "9091"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9091/actuator/health"]

  prometheus:
    image: prom/prometheus:v3.15.1-distroless@sha256:451a845bae1d51622b41af1780eb2ad911bbb79a9855bc8e9bb67fabbc03f934
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    network_mode: service:brief
    depends_on:
      brief:
        condition: service_healthy
        restart: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - brief-prometheus-data:/prometheus
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  brief-prometheus-data:
