spring:
  application:
    name: baton-brief
  datasource:
    url: jdbc:postgresql://localhost:5432/baton_brief
    username: brief
    password: brief
  jackson:
    read:
      strict-duplicate-detection: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    format:
      date: iso
    problemdetails:
      enabled: true
server:
  address: 127.0.0.1
management:
  endpoints:
    web:
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: false
