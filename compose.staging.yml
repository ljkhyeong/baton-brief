name: baton-brief-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${BRIEF_STAGING_DB_NAME:-baton_brief}"
      POSTGRES_USER: "${BRIEF_STAGING_DB_USERNAME:-brief}"
      POSTGRES_PASSWORD_FILE: /run/secrets/brief-database-password
    secrets:
      - source: brief_database_password
        target: brief-database-password
    volumes:
      - brief-staging-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # 기본 10초 안에 체크포인트가 끝나지 않으면 강제 종료 뒤 복구를 시작한다.
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=1m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    logging: *default-logging

  brief:
    image: "${BRIEF_STAGING_IMAGE:-baton-brief:staging}"
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${BRIEF_STAGING_DB_NAME:-baton_brief}"
      SPRING_DATASOURCE_USERNAME: "${BRIEF_STAGING_DB_USERNAME:-brief}"
      BRIEF_EVENT_RECEIVER_AUTHENTICATION_REQUIRED: "true"
      BRIEF_SERVICE_API_AUTHENTICATION_REQUIRED: "true"
      SERVER_ADDRESS: 0.0.0.0
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      TZ: UTC
    secrets:
      - source: brief_database_password
        target: spring.datasource.password
      - source: brief_event_receiver_bearer_token
        target: brief.event-receiver.bearer-token
      - source: brief_event_receiver_previous_bearer_token
        target: brief.event-receiver.previous-bearer-token
      - source: brief_service_api_bearer_token
        target: brief.service-api.bearer-token
      - source: brief_service_api_previous_bearer_token
        target: brief.service-api.previous-bearer-token
    depends_on:
      postgres:
        condition: service_healthy
    # Spring Boot 기본 graceful 종료 단계 대기(30s)보다 길게 둔다.
    stop_grace_period: 40s
    # 제한이 없으면 JVM 힙 상한(75%)이 호스트 전체 메모리를 기준으로 잡힌다.
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    networks:
      - data
      - proxy
    logging: *default-logging

  https:
    profiles: [https]
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    environment:
      BRIEF_STAGING_HOST: "${BRIEF_STAGING_HOST:-brief.invalid}"
    depends_on:
      brief:
        condition: service_healthy
    ports:
      - "${BRIEF_STAGING_HTTP_PUBLISH:-80:80}"
      - "${BRIEF_STAGING_HTTPS_TCP_PUBLISH:-443:443}"
      - "${BRIEF_STAGING_HTTPS_UDP_PUBLISH:-443:443/udp}"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - brief-staging-caddy-data:/data
      - brief-staging-caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - egress
    logging: *default-logging

networks:
  data:
    internal: true
  proxy:
    internal: true
  egress:

volumes:
  brief-staging-postgres-data:
  brief-staging-caddy-data:
  brief-staging-caddy-config:

secrets:
  brief_database_password:
    file: "${BRIEF_STAGING_DATABASE_PASSWORD_FILE:?BRIEF_STAGING_DATABASE_PASSWORD_FILE is required}"
  brief_event_receiver_bearer_token:
    file: "${BRIEF_STAGING_EVENT_RECEIVER_BEARER_TOKEN_FILE:?BRIEF_STAGING_EVENT_RECEIVER_BEARER_TOKEN_FILE is required}"
  brief_event_receiver_previous_bearer_token:
    file: "${BRIEF_STAGING_EVENT_RECEIVER_PREVIOUS_BEARER_TOKEN_FILE:?BRIEF_STAGING_EVENT_RECEIVER_PREVIOUS_BEARER_TOKEN_FILE is required}"
  brief_service_api_bearer_token:
    file: "${BRIEF_STAGING_SERVICE_API_BEARER_TOKEN_FILE:?BRIEF_STAGING_SERVICE_API_BEARER_TOKEN_FILE is required}"
  brief_service_api_previous_bearer_token:
    file: "${BRIEF_STAGING_SERVICE_API_PREVIOUS_BEARER_TOKEN_FILE:?BRIEF_STAGING_SERVICE_API_PREVIOUS_BEARER_TOKEN_FILE is required}"
