version: 2

multi-ecosystem-groups:
  container-images:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      kotlin-plugins:
        patterns:
          - "org.jetbrains.kotlin.jvm"
          - "org.jetbrains.kotlin.plugin.spring"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 3.0.7은 제품과 다른 Jackson 3.2.1 BOM을 테스트에 적용한다.
      - dependency-name: "com.networknt:json-schema-validator"
        versions:
          - "3.0.7"

  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "container-images"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "container-images"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
