version: 2

multi-ecosystem-groups:
  container-images:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      kotlin-plugins:
        patterns:
          - "org.jetbrains.kotlin.jvm"
          - "org.jetbrains.kotlin.plugin.spring"
          - "org.jetbrains.kotlin:kotlin-bom"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 3.0.7부터 제품과 다른 Jackson 3.2 BOM을 테스트에 적용한다. 제품 Jackson이 3.2 계열이 되면 제거한다.
      - dependency-name: "com.networknt:json-schema-validator"
        versions:
          - ">= 3.0.7"
      # ADR-0002의 Jackson 보안 고정은 Spring Boot BOM과 같은 3.1 계열 안에서 패치만 올린다.
      - dependency-name: "tools.jackson:jackson-bom"
        update-types:
          - "version-update:semver-minor"
      # Kotlin 2.4.21의 Gradle 완전 지원 상한은 9.7.0이다(ADR-0002). Kotlin을 올릴 때 호환표와 함께 다시 확인한다.
      - dependency-name: "gradle-wrapper"
        versions:
          - "> 9.7.0"

  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "container-images"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "container-images"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
