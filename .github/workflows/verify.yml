name: 저장소 검증

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: 빌드와 설정 검증
    runs-on: ubuntu-24.04
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Java 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle 검증
        run: ./gradlew --no-daemon clean test :bootstrap:bootJar contractsZip

      - name: Compose 설정 검증
        run: |
          docker compose -f compose.yml config --quiet
          docker compose --env-file .env.staging.example -f compose.staging.yml config --quiet
          docker compose --env-file .env.staging.example -f compose.staging.yml --profile https config --quiet
