name: 저장소 검증

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: 빌드와 설정 검증
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Java 21 설정
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정과 wrapper 검증
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: 파일 검사 도구 검증
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Gradle 검증
        id: gradle-verification
        run: ./gradlew --no-daemon test :bootstrap:bootJar contractsZip

      - name: 실패한 테스트 보고서 보관
        if: ${{ failure() && steps.gradle-verification.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brief-test-reports-${{ github.run_attempt }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          retention-days: 3
          if-no-files-found: ignore

      - name: Compose 설정 검증
        run: |
          docker compose -f compose.yml config --quiet
          docker compose --env-file .env.staging.example -f compose.staging.yml --profile https config --quiet
          docker compose --env-file .env.staging.example -f compose.staging.yml -f compose.service-api.yml config --quiet
          docker compose --env-file .env.staging.example -f compose.staging.yml -f compose.observability.yml config --quiet
          docker compose --env-file .env.staging.example -f compose.staging.yml -f compose.service-api.yml \
            -f compose.observability.yml --profile https config --quiet
          docker compose -f compose.ci-tools.yml config --quiet
          # Testcontainers와 개발용·스테이징 PostgreSQL이 같은 버전인지 확인한다.
          test "$(grep -hoE 'postgres:[0-9.]+-alpine' compose.yml compose.staging.yml \
            bootstrap/src/test/kotlin/com/personal/baton/brief/BriefPostgresConfiguration.kt | sort -u | wc -l)" -eq 1

      - name: 지표 설정과 경보 규칙 검증
        run: |
          prometheus_image="$(docker compose --env-file .env.staging.example -f compose.staging.yml -f compose.observability.yml config --format json | jq -r '.services.prometheus.image')"
          promtool=(docker run --rm --network none --entrypoint /bin/promtool
            --volume "$PWD/ops/prometheus:/etc/prometheus:ro" --workdir /etc/prometheus "$prometheus_image")
          "${promtool[@]}" check config /etc/prometheus/prometheus.yml
          "${promtool[@]}" test rules alerts.test.yml
          alertmanager_image="$(docker compose -f compose.ci-tools.yml config --format json | jq -r '.services.alertmanager.image')"
          amtool=(docker run --rm --network none --entrypoint /bin/amtool
            --volume "$PWD/ops/alertmanager:/etc/alertmanager:ro"
            "$alertmanager_image")
          for channel in slack discord slack-discord; do
            config="/etc/alertmanager/brief-$channel.example.yml"
            "${amtool[@]}" check-config "$config"
            "${amtool[@]}" config routes test --config.file="$config" \
              --verify.receivers="brief-$channel" service=brief alertname=BriefServerErrors
            "${amtool[@]}" config routes test --config.file="$config" \
              --verify.receivers=unmatched service=relay alertname=BriefServerErrors
          done
          bash -n ops/backup-postgresql.sh
          bash -n ops/verify-postgresql-backup.sh

      - name: 스테이징 PostgreSQL 이미지 확인
        run: >-
          docker compose --env-file .env.staging.example
          -f compose.staging.yml pull postgres

      - name: 스테이징 이미지 빌드
        run: |
          docker build --tag baton-brief:ci .
          docker build --file Dockerfile.service-caddy --tag baton-brief-service-caddy:ci .
          docker run --rm --network none --entrypoint /bin/sh \
            baton-brief-service-caddy:ci \
            -c 'test -z "$(getcap /usr/bin/caddy)" && test "$(id -u)" = 10001'

      - name: Caddy 설정 검증
        run: |
          caddy_image="$(
            docker compose --env-file .env.staging.example \
              -f compose.staging.yml --profile https config --format json \
              | jq -r '.services.https.image'
          )"
          docker run --rm --network none \
            --env BRIEF_STAGING_HOST=brief.invalid \
            --volume "${{ github.workspace }}/ops/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy_image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --network none \
            --env BRIEF_SERVICE_HOST=brief-service \
            --entrypoint caddy \
            --volume "${{ github.workspace }}/ops/Caddyfile.service:/etc/caddy/Caddyfile:ro" \
            baton-brief-service-caddy:ci \
            adapt --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: 스테이징 HTTPS 실행 경계 검증
        shell: bash
        run: |
          set -euo pipefail

          staging_dir="$(mktemp -d)"
          compose=(
            docker compose
            --project-name baton-brief-ci
            --env-file .env.staging.example
            -f compose.staging.yml
            -f compose.service-api.yml
            -f compose.observability.yml
            --profile https
          )
          service_network="baton-brief-ci-service"
          cleanup() {
            local original_status=$?
            local cleanup_status=0
            trap - EXIT
            set +e
            if ((original_status != 0)); then
              echo "::group::스테이징 실패 진단"
              "${compose[@]}" ps --all
              "${compose[@]}" logs --no-color --tail 100
              echo "::endgroup::"
            fi
            "${compose[@]}" down --volumes --remove-orphans || cleanup_status=$?
            docker network rm "$service_network" >/dev/null || cleanup_status=$?
            rm -rf "$staging_dir" || cleanup_status=$?
            if ((original_status != 0)); then
              exit "$original_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          event_token="ci-event-token-000000000000000000000000"
          service_token="ci-service-token-0000000000000000000000"
          echo "::add-mask::$event_token"
          echo "::add-mask::$service_token"
          curl_image="$(docker compose -f compose.ci-tools.yml config --format json | jq -r '.services.curl.image')"
          printf '%s' "ci-database-password" > "$staging_dir/database-password"
          printf '%s' "$event_token" > "$staging_dir/event-bearer-token"
          : > "$staging_dir/event-previous-bearer-token"
          printf '%s' "$service_token" > "$staging_dir/service-bearer-token"
          : > "$staging_dir/service-previous-bearer-token"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=brief-service' \
            -addext 'subjectAltName=DNS:brief-service' \
            -keyout "$staging_dir/service-tls-key.pem" \
            -out "$staging_dir/service-tls-cert.pem" \
            >/dev/null 2>&1
          chmod 0444 "$staging_dir/service-tls-cert.pem" "$staging_dir/service-tls-key.pem"
          docker network create --internal "$service_network" >/dev/null

          export BRIEF_STAGING_DATABASE_PASSWORD_FILE="$staging_dir/database-password"
          export BRIEF_STAGING_EVENT_RECEIVER_BEARER_TOKEN_FILE="$staging_dir/event-bearer-token"
          export BRIEF_STAGING_EVENT_RECEIVER_PREVIOUS_BEARER_TOKEN_FILE="$staging_dir/event-previous-bearer-token"
          export BRIEF_STAGING_SERVICE_API_BEARER_TOKEN_FILE="$staging_dir/service-bearer-token"
          export BRIEF_STAGING_SERVICE_API_PREVIOUS_BEARER_TOKEN_FILE="$staging_dir/service-previous-bearer-token"
          export BRIEF_STAGING_SERVICE_API_TLS_CERT_FILE="$staging_dir/service-tls-cert.pem"
          export BRIEF_STAGING_SERVICE_API_TLS_KEY_FILE="$staging_dir/service-tls-key.pem"
          export BRIEF_STAGING_IMAGE="baton-brief:ci"
          export BRIEF_STAGING_SERVICE_CADDY_IMAGE="baton-brief-service-caddy:ci"
          export BRIEF_STAGING_HOST="localhost"
          export BRIEF_STAGING_HTTP_PUBLISH="127.0.0.1:38080:80"
          export BRIEF_STAGING_HTTPS_TCP_PUBLISH="127.0.0.1:38443:443"
          export BRIEF_STAGING_HTTPS_UDP_PUBLISH="127.0.0.1:38443:443/udp"
          export BRIEF_SERVICE_HOST="brief-service"
          export BATON_BRIEF_PRIVATE_NETWORK="$service_network"

          "${compose[@]}" up --detach --wait --wait-timeout 180 --no-build

          brief_id="$("${compose[@]}" ps --quiet brief)"
          https_id="$("${compose[@]}" ps --quiet https)"
          service_api_id="$("${compose[@]}" ps --quiet service-api)"
          test -n "$brief_id"
          test -n "$https_id"
          test -n "$service_api_id"
          service_api_curl() {
            docker run --rm --network "container:$service_api_id" \
              --volume "$staging_dir/service-tls-cert.pem:/tmp/service-tls-cert.pem:ro" \
              "$curl_image" \
              --silent --show-error --connect-timeout 5 --max-time 10 \
              --cacert /tmp/service-tls-cert.pem \
              --resolve 'brief-service:8443:127.0.0.1' \
              "$@"
          }
          public_curl() {
            curl --silent --show-error --connect-timeout 5 --max-time 10 \
              --cacert "$staging_dir/root.crt" \
              --resolve 'localhost:38443:127.0.0.1' \
              "$@"
          }
          http_status() {
            "$@" --output /dev/null --write-out '%{http_code}'
          }
          assert_two_internal_networks() {
            local networks
            test "$(docker inspect "$1" | jq '.[0].NetworkSettings.Networks | length')" = "2"
            networks="$(docker inspect "$1" | jq --raw-output '.[0].NetworkSettings.Networks | keys[]')"
            while IFS= read -r network; do
              test "$(docker network inspect --format '{{.Internal}}' "$network")" = "true"
            done <<< "$networks"
          }
          test -z "$(docker port "$brief_id")"
          test -z "$(docker port "$service_api_id")"
          test "$(docker inspect --format '{{.State.Status}}' "$service_api_id")" = "running"
          test "$(docker inspect --format '{{.RestartCount}}' "$service_api_id")" = "0"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$brief_id")" = "healthy"
          test "$(docker exec "$brief_id" id -u)" = "10001"
          docker inspect "$brief_id" | jq --exit-status \
            '.[0].HostConfig.ReadonlyRootfs == true and .[0].HostConfig.CapDrop == ["ALL"]'

          assert_two_internal_networks "$brief_id"

          docker inspect "$https_id" | jq --exit-status \
            '.[0].HostConfig.ReadonlyRootfs == true
             and .[0].HostConfig.CapDrop == ["ALL"]
             and (.[0].HostConfig.CapAdd | length == 1)
             and (.[0].HostConfig.CapAdd[0] | endswith("NET_BIND_SERVICE"))'
          docker port "$https_id" 443/tcp | grep --fixed-strings --line-regexp '127.0.0.1:38443'

          docker inspect "$service_api_id" | jq --exit-status \
            '.[0].HostConfig.ReadonlyRootfs == true
             and .[0].HostConfig.CapDrop == ["ALL"]
             and ((.[0].HostConfig.CapAdd // []) | length == 0)
             and .[0].HostConfig.LogConfig.Type == "json-file"
             and .[0].HostConfig.LogConfig.Config["max-size"] == "10m"
             and .[0].HostConfig.LogConfig.Config["max-file"] == "3"'
          assert_two_internal_networks "$service_api_id"

          for _attempt in $(seq 1 30); do
            if docker cp \
              "$https_id:/data/caddy/pki/authorities/local/root.crt" \
              "$staging_dir/root.crt" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test -s "$staging_dir/root.crt"

          test "$(http_status public_curl --header 'Content-Type: application/json' \
            --data-binary '@contracts/examples/role-unassigned.active-r1-critical.json' \
            https://localhost:38443/api/v1/events)" = "401"

          authenticated_status="$(
            public_curl --header 'Content-Type: application/json' \
              --header "Authorization: Bearer $event_token" \
              --data-binary '@contracts/examples/role-unassigned.active-r1-critical.json' \
              --output "$staging_dir/event-response.json" \
              --write-out '%{http_code}' \
              https://localhost:38443/api/v1/events
          )"
          test "$authenticated_status" = "202"
          jq --exit-status '.status == "APPLIED"' "$staging_dir/event-response.json"

          mkdir "$staging_dir/backups"
          COMPOSE_PROJECT_NAME=baton-brief-ci \
            BRIEF_STAGING_ENV_FILE="$PWD/.env.staging.example" \
            BRIEF_BACKUP_DIRECTORY="$staging_dir/backups" \
            bash ops/backup-postgresql.sh
          backup_files=("$staging_dir/backups"/*/database.dump)
          test "${#backup_files[@]}" = "1"
          test -s "${backup_files[0]}"
          grep --fixed-strings --line-regexp --quiet 'flyway_version=1' "$(dirname "${backup_files[0]}")/manifest.txt"
          BRIEF_BACKUP_FILE="${backup_files[0]}" bash ops/verify-postgresql-backup.sh

          backup_bytes="$(wc -c < "${backup_files[0]}")"
          head -c "$((backup_bytes / 2))" "${backup_files[0]}" > "$staging_dir/truncated.dump"
          if BRIEF_BACKUP_FILE="$staging_dir/truncated.dump" \
            bash ops/verify-postgresql-backup.sh > "$staging_dir/restore-error.log" 2>&1; then
            echo "손상된 백업을 복원 성공으로 처리했습니다." >&2
            exit 1
          fi

          test "$(http_status public_curl https://localhost:38443/actuator/health)" = "404"
          # 허용 경로는 대소문자까지 일치해야 앱으로 전달한다.
          test "$(public_curl --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $event_token" \
            --data-binary '@contracts/examples/role-unassigned.active-r1-critical.json' \
            --output /dev/null --write-out '%{http_code} %{size_download}' \
            https://localhost:38443/API/V1/EVENTS)" = "404 0"
          # 본문 크기 제한은 앱에 닿기 전에 413으로 끝낸다.
          head -c 70000 /dev/zero | tr '\0' 'a' > "$staging_dir/oversized.json"
          test "$(http_status public_curl --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $event_token" \
            --data-binary "@$staging_dir/oversized.json" \
            https://localhost:38443/api/v1/events)" = "413"

          service_response="$(
            service_api_curl --fail \
              --header="Authorization: Bearer $service_token" \
              'https://brief-service:8443/api/v1/workspaces/10000000-0000-0000-0000-000000000008/seasons/20000000-0000-0000-0000-000000000008/attention-items?limit=1'
          )"
          jq --exit-status '.items | length == 1' <<< "$service_response"

          summary_path='/api/v1/workspaces/10000000-0000-0000-0000-000000000008/seasons/20000000-0000-0000-0000-000000000008/attention-items/summary'
          summary_response="$(
            service_api_curl --fail \
              --header="Authorization: Bearer $service_token" \
              "https://brief-service:8443$summary_path"
          )"
          jq --exit-status '.highCount == 1 and .mediumCount == 0 and .revisionGapCount == 0' <<< "$summary_response"

          test "$(http_status public_curl --header "Authorization: Bearer $service_token" \
            "https://localhost:38443$summary_path")" = "404"
          test "$(http_status service_api_curl "https://brief-service:8443$summary_path")" = "401"

          resolutions_path="${summary_path%/summary}/resolutions?weekStart=2026-08-24&zoneId=Asia/Seoul"
          resolutions_response="$(
            service_api_curl --fail --header="Authorization: Bearer $service_token" \
              "https://brief-service:8443$resolutions_path"
          )"
          jq --exit-status '.resolvedCount == 0 and .weekStart == "2026-08-24"' <<< "$resolutions_response"
          test "$(http_status service_api_curl "https://brief-service:8443$resolutions_path")" = "401"
          test "$(http_status public_curl --header "Authorization: Bearer $service_token" \
            "https://localhost:38443$resolutions_path")" = "404"
          test "$(http_status service_api_curl --header="Authorization: Bearer $service_token" \
            'https://brief-service:8443/actuator/health')" = "404"
          # 허용 목록의 모든 경로는 서비스 Caddy를 지나 앱 인증까지 도달해야 한다.
          scope_path="${summary_path%/attention-items/summary}"
          edition_id="50000000-0000-0000-0000-000000000001"
          item_query="eventType=ROLE_UNASSIGNED&sourceReference=handoff:1"
          week_query="weekStart=2026-08-24&zoneId=Asia/Seoul"
          for path in \
            "$scope_path/attention-items" \
            "$scope_path/attention-items/current?$item_query" \
            "$scope_path/attention-items/transitions?$item_query" \
            "$scope_path/editions" \
            "$scope_path/editions/latest" \
            "$scope_path/editions/weekly/latest?$week_query" \
            "$scope_path/editions/$edition_id/changes?fromEditionId=$edition_id" \
            "$scope_path/editions/$edition_id/freshness" \
            "/api/v1/editions/$edition_id" \
            "/api/v1/editions/$edition_id/changes?fromEditionId=$edition_id"; do
            test "$(http_status service_api_curl "https://brief-service:8443$path")" = "401"
          done
          test "$(http_status service_api_curl --request POST "https://brief-service:8443$scope_path/editions")" = "401"

          # 목록 밖 경로와 메서드는 서비스 token이 있어도 Caddy가 404로 끝낸다.
          for request in \
            "POST /api/v1/projections/rebuild" \
            "POST /api/v1/events" \
            "GET /api/v1/events/$edition_id/receipt" \
            "GET $scope_path/event-receipts/anomalies" \
            "DELETE $scope_path/editions"; do
            test "$(http_status service_api_curl --header="Authorization: Bearer $service_token" \
              --request "${request%% *}" "https://brief-service:8443${request#* }")" = "404"
          done
          test "$(http_status service_api_curl --header="Authorization: Bearer $service_token" \
            --header 'Content-Type: application/json' --data-raw "$(cat "$staging_dir/oversized.json")" \
            "https://brief-service:8443$scope_path/editions")" = "413"

          # 서비스 Caddy는 8443만 열어 평문 리디렉션으로 Bearer를 받지 않는다.
          service_api_ports="$(docker exec "$service_api_id" netstat -ltn)"
          if grep --quiet ':80 ' <<< "$service_api_ports"; then
            echo "서비스 Caddy가 80 포트를 열었습니다." >&2
            exit 1
          fi

          # 원본 참조는 서비스 Caddy 접근 로그에 남기지 않는다.
          log_sentinel="brief-log-sentinel-reference"
          service_api_curl --output /dev/null --header="Authorization: Bearer $service_token" \
            "https://brief-service:8443$scope_path/attention-items/current?eventType=ROLE_UNASSIGNED&sourceReference=$log_sentinel"

          # 경보 규칙이 쓰는 지표가 실제로 수집되는지 확인한다.
          for metric in brief_events_received_total hikaricp_connections_pending http_server_requests_seconds_count; do
            scraped=""
            for _attempt in $(seq 1 40); do
              if docker exec "$brief_id" wget -q -T 10 -O - \
                "http://127.0.0.1:9090/api/v1/query?query=$metric%7Bjob%3D%22brief%22%7D" \
                | jq --exit-status '.data.result | length > 0' > /dev/null; then
                scraped="true"
                break
              fi
              sleep 2
            done
            test "$scraped" = "true"
          done

          # 로그 수집 실패는 즉시 중단하고 grep의 조기 종료와 분리한다.
          brief_logs="$(docker logs "$brief_id" 2>&1)"
          https_logs="$(docker logs "$https_id" 2>&1)"
          service_api_logs="$(docker logs "$service_api_id" 2>&1)"

          assert_token_absent() {
            if grep --fixed-strings --quiet "$1" <<< "$2"; then
              echo "$3" >&2
              exit 1
            fi
          }
          assert_token_absent "$event_token" "$brief_logs" "BRIEF 로그에 Bearer token이 노출됐습니다."
          assert_token_absent "$event_token" "$https_logs" "Caddy 로그에 Bearer token이 노출됐습니다."
          assert_token_absent "$service_token" "$brief_logs" "BRIEF 로그에 서비스 API Bearer token이 노출됐습니다."
          assert_token_absent "$service_token" "$https_logs" "공개 Caddy 로그에 서비스 API Bearer token이 노출됐습니다."
          assert_token_absent "$service_token" "$service_api_logs" "서비스 Caddy 로그에 Bearer token이 노출됐습니다."
          assert_token_absent "$log_sentinel" "$service_api_logs" "서비스 Caddy 로그에 원본 참조가 노출됐습니다."
