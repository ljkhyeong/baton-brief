name: Gradle 의존성 제출

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-dependency-graph:
    name: 의존성 그래프 생성
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Java 21 설정
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 의존성 그래프 생성
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: generate-and-upload
          cache-provider: basic
          validate-wrappers: true

  submit-dependency-graph:
    name: 의존성 그래프 제출
    needs: generate-dependency-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Gradle 의존성 그래프 제출
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: download-and-submit
          cache-disabled: true
