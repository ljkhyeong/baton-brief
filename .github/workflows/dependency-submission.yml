name: Gradle 의존성 제출

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-dependency-graph:
    name: 의존성 그래프 생성
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Java 21 설정
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 의존성 그래프 생성
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-upload
          cache-provider: basic
          validate-wrappers: true

  submit-dependency-graph:
    name: 의존성 그래프 제출
    needs: generate-dependency-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Gradle 의존성 그래프 제출
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit
          cache-disabled: true
